<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Citation Rate Analyzer</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Hero / Search Section -->
  <section id="hero">
    <h1>LLM Citation Rate Analyzer</h1>
    <p class="subtitle">URL을 입력하면 주요 LLM에서의 인용율을 분석합니다</p>

    <!-- LLM Status Badges -->
    <div id="llm-status" class="status-bar"></div>

    <form id="search-form">
      <div class="input-group">
        <input
          id="url-input"
          type="text"
          placeholder="분석할 URL을 입력하세요  (예: samsung.com)"
          autocomplete="off"
          required
        />
        <button type="submit" id="search-btn">
          <span class="btn-text">검색</span>
          <span class="btn-loading" hidden>
            <span class="spinner"></span> 분석 중...
          </span>
        </button>
      </div>
      <!-- Query Mode Toggle -->
      <div class="query-mode-toggle">
        <button type="button" class="mode-tab active" data-mode="auto">자동 생성 쿼리</button>
        <button type="button" class="mode-tab" data-mode="custom">직접 작성</button>
      </div>

      <!-- Auto mode options -->
      <div id="auto-options" class="query-options">
        <label for="num-queries">쿼리 수</label>
        <select id="num-queries">
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="10" selected>10</option>
        </select>
      </div>

      <!-- Custom prompt area -->
      <div id="custom-prompt-area" class="custom-prompt-area" hidden>
        <div id="prompt-list">
          <div class="prompt-row">
            <span class="prompt-num">1</span>
            <textarea class="prompt-input" rows="2" placeholder="LLM에 보낼 프롬프트를 입력하세요 (예: 삼성전자의 최신 스마트폰에 대해 알려줘. 출처를 포함해줘.)"></textarea>
            <button type="button" class="remove-prompt-btn" title="삭제" hidden>&times;</button>
          </div>
        </div>
        <button type="button" id="add-prompt-btn" class="add-prompt-btn">+ 프롬프트 추가</button>
      </div>
    </form>

    <p id="error-msg" class="error" hidden></p>
  </section>

  <!-- Results Section -->
  <section id="results" hidden>
    <div class="result-header">
      <h2>분석 결과</h2>
      <p id="result-domain" class="domain-badge"></p>
      <p id="result-brand" class="brand-label"></p>
    </div>

    <!-- Main bar chart -->
    <div class="chart-container">
      <canvas id="citation-chart"></canvas>
    </div>

    <!-- Per-LLM detail cards -->
    <div id="llm-cards" class="cards-grid"></div>

    <!-- Top cited domains chart -->
    <div class="chart-container secondary-chart">
      <h3>전체 LLM 기준 상위 인용 도메인</h3>
      <canvas id="domain-chart"></canvas>
    </div>
  </section>

  <footer>
    <p>LLM Citation Rate Analyzer &mdash; API 키를 <code>.env</code> 파일에 설정하면 실제 LLM을 사용합니다</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
